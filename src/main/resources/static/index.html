function App() {
  const [tela, setTela] = useState('pedidos'); // 'pedidos' | 'cardapio' | 'avaliacoes'
  const [apiUrl, setApiUrl] = useState('http://localhost:8080/api/pedidos');
  const [urlEdit, setUrlEdit] = useState(apiUrl);
  const [showConfig, setShowConfig] = useState(false);
  const [statusApi, setStatusApi] = useState('carregando');
  const [erroDetalhe, setErroDetalhe] = useState('');
  
  // Estados principais
  const [pedidos, setPedidos] = useState(INITIAL_PEDIDOS);
  const [avaliacoes, setAvaliacoes] = useState(INITIAL_AVALIACOES);
  
  // Filtros
  const [buscaPedido, setBuscaPedido] = useState('');
  const [filtroStatus, setFiltroStatus] = useState('TODOS');
  const [filtroCategoria, setFiltroCategoria] = useState('TODOS');
  
  // Modais e formulários
  const [modalPedido, setModalPedido] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [formPedido, setFormPedido] = useState(EMPTY_FORM);
  const [deletandoId, setDeletandoId] = useState(null);
  
  const [modalAvaliacao, setModalAvaliacao] = useState(false);
  const [formAvaliacao, setFormAvaliacao] = useState({
    nome: '',
    estrelas: 5,
    item: 'Açaí Puro Copo 500ml',
    comentario: ''
  });
  const [hoverEstrelas, setHoverEstrelas] = useState(0);

  // Toast
  const [toast, setToast] = useState(null);
  const avisar = (mensagem, tipo = 'sucesso') => {
    setToast({ mensagem, tipo });
    setTimeout(() => setToast(null), 3800);
  };

  // REST API Integrada
  const requestApi = async (path = '', options = {}) => {
    const res = await fetch(`${apiUrl.replace(/\/$/, '')}${path}`, options);
    if (!res.ok) throw new Error(`HTTP Status ${res.status}`);
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  };

  const carregarPedidos = async () => {
    setStatusApi('carregando');
    try {
      const dados = await requestApi();
      if (dados && Array.isArray(dados)) {
        setPedidos(dados);
        setStatusApi('conectado');
      } else {
        setStatusApi('offline');
      }
    } catch (e) {
      setStatusApi('erro');
      setErroDetalhe(e.message || 'Servidor offline. Usando gestão local de pedidos.');
    }
  };

  useEffect(() => {
    carregarPedidos();
  }, [apiUrl]);

  // Salvar Pedido
  const salvarPedido = async (e) => {
    e.preventDefault();
    const qtd = Number(formPedido.quantidade) || 1;
    const precoUnitario = MENU_STRICT.find(m => m.nome === formPedido.item)?.preco || formPedido.preco;
    const precoTotal = precoUnitario * qtd;

    const dados = {
      ...formPedido,
      quantidade: qtd,
      preco: precoTotal
    };

    try {
      if (statusApi === 'conectado') {
        if (editandoId !== null) {
          await requestApi(`/${editandoId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
        } else {
          await requestApi('', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
        }
        await carregarPedidos();
      } else {
        if (editandoId !== null) {
          setPedidos(prev => prev.map(p => p.id === editandoId ? { ...dados, id: editandoId } : p));
        } else {
          const novoId = String(Date.now()).slice(-4);
          setPedidos(prev => [{ ...dados, id: novoId }, ...prev]);
        }
      }

      avisar(editandoId !== null ? 'Pedido atualizado!' : 'Pedido de açaí/água registrado!');
      setModalPedido(false);
      setFormPedido(EMPTY_FORM);
      setEditandoId(null);
    } catch (err) {
      avisar(`Erro ao salvar: ${err.message}`, 'erro');
    }
  };

  // Preencher Form ao trocar item
  const handleItemChange = (nomeItem) => {
    const itemSel = MENU_STRICT.find(m => m.nome === nomeItem);
    if (itemSel) {
      setFormPedido(prev => ({
        ...prev,
        item: itemSel.nome,
        categoria: itemSel.categoria,
        preco: itemSel.preco,
        foto: itemSel.foto
      }));
    }
  };

  const editarPedido = (p) => {
    setFormPedido({
      cliente: p.cliente || '',
      categoria: p.categoria || 'ACAI',
      item: p.item || 'Açaí Puro Copo 500ml',
      quantidade: p.quantidade || 1,
      preco: p.preco || 18.00,
      pago: !!p.pago,
      status: p.status || 'PENDENTE',
      observacoes: p.observacoes || '',
      foto: p.foto || IMAGES.acai500
    });
    setEditandoId(p.id);
    setModalPedido(true);
  };

  const avançarStatus = (id) => {
    const proximos = { 'PENDENTE': 'EM_PREPARO', 'EM_PREPARO': 'PRONTO', 'PRONTO': 'ENTREGUE', 'ENTREGUE': 'PENDENTE' };
    setPedidos(prev => prev.map(p => {
      if (p.id === id) {
        const nxt = proximos[p.status] || 'PENDENTE';
        avisar(`Status do pedido #${id} -> ${nxt.replace('_', ' ')}`);
        return { ...p, status: nxt };
      }
      return p;
    }));
  };

  const excluirPedido = async (id) => {
    try {
      if (statusApi === 'conectado') {
        await requestApi(`/${id}`, { method: 'DELETE' });
      }
      setPedidos(prev => prev.filter(p => p.id !== id));
      avisar('Pedido removido!');
      setDeletandoId(null);
    } catch (err) {
      avisar(`Erro ao deletar: ${err.message}`, 'erro');
    }
  };

  // Pedir direto do Cardápio
  const pedirDoCardapio = (prod) => {
    setFormPedido({
      cliente: '',
      categoria: prod.categoria,
      item: prod.nome,
      quantidade: 1,
      preco: prod.preco,
      pago: false,
      status: 'PENDENTE',
      observacoes: '',
      foto: prod.foto
    });
    setEditandoId(null);
    setTela('pedidos');
    setModalPedido(true);
  };

  // Salvar Avaliação
  const publicarAvaliacao = (e) => {
    e.preventDefault();
    if (!formAvaliacao.nome.trim() || !formAvaliacao.comentario.trim()) {
      avisar('Preencha seu nome e depoimento!', 'erro');
      return;
    }

    const nova = {
      id: `rev-${Date.now()}`,
      nome: formAvaliacao.nome,
      avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)],
      estrelas: Number(formAvaliacao.estrelas),
      data: 'Agora mesmo',
      item: formAvaliacao.item,
      comentario: formAvaliacao.comentario,
      curtidas: 0,
      verificado: true
    };

    setAvaliacoes(prev => [nova, ...prev]);
    setModalAvaliacao(false);
    setFormAvaliacao({ nome: '', estrelas: 5, item: 'Açaí Puro Copo 500ml', comentario: '' });
    avisar('Sua avaliação foi enviada! Muito obrigado! 💜');
  };

  // Métricas
  const totalAcais = useMemo(() => pedidos.filter(p => p.categoria === 'ACAI').reduce((acc, p) => acc + (p.quantidade || 1), 0), [pedidos]);
  const totalAguas = useMemo(() => pedidos.filter(p => p.categoria === 'AGUA').reduce((acc, p) => acc + (p.quantidade || 1), 0), [pedidos]);
  const faturamentoTotal = useMemo(() => pedidos.reduce((acc, p) => acc + (Number(p.preco) || 0), 0), [pedidos]);
  const mediaEstrelas = useMemo(() => {
    if (avaliacoes.length === 0) return 5.0;
    return (avaliacoes.reduce((a, b) => a + b.estrelas, 0) / avaliacoes.length).toFixed(1);

          )}


          {/* ================= SEÇÃO 3: AVALIAÇÕES ================= */}
          {tela === 'avaliacoes' && (
            <div className="space-y-8">
              {/* Header Avaliações */}
              <div className="bg-acai-card border border-acai-border/80 rounded-3xl p-6 md:p-8 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                <div className="md:col-span-5 text-center border-b md:border-b-0 md:border-r border-acai-border/60 pb-6 md:pb-0 md:pr-6 space-y-2">
                  <span className="text-5xl font-black text-amber-400">{mediaEstrelas}</span>
                  <div className="flex justify-center gap-1 my-1">
                    {[1, 2, 3, 4, 5].map((st) => (
                      <Icons.Star key={st} size={22} filled={st <= Math.round(mediaEstrelas)} />
                    ))}
                  </div>
                  <p className="text-xs font-extrabold text-white">Açaiteria Aprovada por Quem Ama Açaí de Verdade</p>
                </div>

                <div className="md:col-span-7 space-y-3">
                  <h3 className="font-black text-lg text-purple-300">Açaí Puro Sem Ilusões</h3>
                  <p className="text-xs text-acai-subtext leading-relaxed">
                    Nossos clientes escolhem o AçaíFy pela garantia de receber açaí denso, puro e sem aditivos baratos. Veja o que dizem!
                  </p>
                  <button
                    onClick={() => setModalAvaliacao(true)}
                    className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-black text-xs transition"
                  >
                    ✍️ Escrever Avaliação
                  </button>
                </div>
              </div>

              {/* Lista de Avaliações */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {avaliacoes.map((rev) => (
                  <article key={rev.id} className="bg-acai-card border border-acai-border/80 rounded-3xl p-5 space-y-4 acai-glow flex flex-col justify-between">
                    <div className="space-y-3">
                      <div className="flex items-start justify-between">
                        <div className="flex items-center gap-3">
                          <img src={rev.avatar} alt={rev.nome} className="w-11 h-11 rounded-full object-cover border-2 border-purple-500/40" />
                          <div>
                            <div className="flex items-center gap-1.5">
                              <h4 className="font-extrabold text-sm text-white">{rev.nome}</h4>
                              <span className="text-emerald-400 text-[9px] bg-emerald-950/60 border border-emerald-800/40 px-1.5 py-0.2 rounded-full font-bold">✓ Cliente Verificado</span>
                            </div>
                            <span className="text-[10px] text-acai-subtext">{rev.data}</span>
                          </div>
                        </div>

                        <div className="flex gap-0.5">
                          {[1, 2, 3, 4, 5].map((st) => (
                            <Icons.Star key={st} size={14} filled={st <= rev.estrelas} />
                          ))}
                        </div>
                      </div>

                      <div className="bg-purple-950/40 p-2.5 rounded-xl border border-purple-900/30 text-[11px] font-extrabold text-purple-300">
                        Item do Pedido: {rev.item}
                      </div>

                      {rev.foto && (
                        <div className="overflow-hidden rounded-2xl border border-purple-500/30">
                          <img src={rev.foto} alt={rev.item} className="w-full h-40 object-cover hover:scale-105 transition-transform duration-300" />
                        </div>
                      )}

                      <p className="text-xs text-white/90 leading-relaxed font-normal">"{rev.comentario}"</p>
                    </div>

                    <div className="flex items-center justify-between pt-3 border-t border-acai-border/50 text-xs">
                      <button
                        onClick={() => {
                          setAvaliacoes(prev => prev.map(a => a.id === rev.id ? { ...a, curtidas: a.curtidas + 1 } : a));
                          avisar('Obrigado pelo apoio!');
                        }}
                        className="flex items-center gap-1.5 text-acai-subtext hover:text-purple-300 transition"
                      >
                        <Icons.ThumbsUp size={14} />
                        <span className="text-[11px] font-bold">Útil ({rev.curtidas})</span>
                      </button>
                      <span className="text-[10px] text-acai-subtext">AçaíFy 100% Puro</span>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          )}

        </div>
      </main>


      {/* ================= MODAL: NOVO / EDITAR PEDIDO ================= */}
      {modalPedido && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-acai-card border border-acai-border rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-6 shadow-2xl relative">
            <div className="flex justify-between items-center border-b border-acai-border pb-4">
              <div>
                <span className="text-[10px] font-black uppercase tracking-widest text-purple-400">Comanda Açaí & Água</span>
                <h3 className="text-xl font-black text-white">{editandoId !== null ? 'Editar Pedido' : 'Registrar Novo Pedido'}</h3>
              </div>
              <button onClick={() => setModalPedido(false)} className="text-acai-subtext hover:text-white p-1">
                <Icons.X size={22} />
              </button>
            </div>

            <form onSubmit={salvarPedido} className="space-y-4">
              <div>
                <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Nome do Cliente *</label>
                <input
                  required
                  type="text"
                  value={formPedido.cliente}
                  onChange={e => setFormPedido({ ...formPedido, cliente: e.target.value })}
                  placeholder="Ex.: Carolina Santos"
                  className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400"
                />
              </div>

              <div>
                <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Selecione o Item (Strictly Açaí ou Água) *</label>
                <select
                  value={formPedido.item}
                  onChange={e => handleItemChange(e.target.value)}
                  className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400 font-bold"
                >
                  <optgroup label="Açaí Puro">
                    {MENU_STRICT.filter(m => m.categoria === 'ACAI').map(m => (
                      <option key={m.id} value={m.nome}>{m.nome} — R$ {m.preco.toFixed(2)}</option>
                    ))}
                  </optgroup>
                  <optgroup label="Água & Hidratação">
                    {MENU_STRICT.filter(m => m.categoria === 'AGUA').map(m => (
                      <option key={m.id} value={m.nome}>{m.nome} — R$ {m.preco.toFixed(2)}</option>
                    ))}
                  </optgroup>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Quantidade</label>
                  <input
                    type="number"
                    min="1"
                    max="50"
                    value={formPedido.quantidade}
                    onChange={e => setFormPedido({ ...formPedido, quantidade: e.target.value })}
                    className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400"
                  />
                </div>

                <div>
                  <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Estado do Pedido</label>
                  <select
                    value={formPedido.status}
                    onChange={e => setFormPedido({ ...formPedido, status: e.target.value })}
                    className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400"
                  >
                    <option value="PENDENTE">Pendente</option>
                    <option value="EM_PREPARO">Em Preparo</option>
                    <option value="PRONTO">Pronto</option>
                    <option value="ENTREGUE">Entregue</option>
                  </select>
                </div>
              </div>

              <div className="flex items-center pt-2">
                <label className="flex items-center gap-3 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={formPedido.pago}
                    onChange={e => setFormPedido({ ...formPedido, pago: e.target.checked })}
                    className="w-5 h-5 accent-purple-500 rounded"
                  />
                  <span className="text-xs font-bold text-white">Pedido Já Pago</span>
                </label>
              </div>

              <div>
                <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Observações</label>
                <textarea
                  rows="2"
                  value={formPedido.observacoes}
                  onChange={e => setFormPedido({ ...formPedido, observacoes: e.target.value })}
                  placeholder="Instruções de entrega ou retirada..."
                  className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400"
                ></textarea>
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  type="button"
                  onClick={() => setModalPedido(false)}
                  className="flex-1 py-3 rounded-full border border-acai-border font-bold text-xs hover:bg-acai-dark transition"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-3 rounded-full bg-gradient-to-r from-purple-600 to-purple-500 text-white font-black text-xs shadow-lg shadow-purple-950 transition"
                >
                  {editandoId !== null ? 'Salvar Alterações' : 'Confirmar Pedido'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}


      {/* ================= MODAL: CRIAR AVALIAÇÃO ================= */}
      {modalAvaliacao && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-acai-card border border-acai-border rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
            <div className="flex justify-between items-center border-b border-acai-border pb-3">
              <h3 className="text-lg font-black text-white">Avaliar o AçaíFy</h3>
              <button onClick={() => setModalAvaliacao(false)} className="text-acai-subtext hover:text-white">✕</button>
            </div>

            <form onSubmit={publicarAvaliacao} className="space-y-4">
              <div className="text-center space-y-2 py-3 bg-acai-dark rounded-2xl border border-purple-900/30">
                <span className="text-xs font-black uppercase text-acai-subtext">Sua Nota</span>
                <div className="flex justify-center gap-2">
                  {[1, 2, 3, 4, 5].map((st) => (
                    <button
                      key={st}
                      type="button"
                      onClick={() => setFormAvaliacao({ ...formAvaliacao, estrelas: st })}
                      onMouseEnter={() => setHoverEstrelas(st)}
                      onMouseLeave={() => setHoverEstrelas(0)}
                      className="p-1 transform transition hover:scale-125"
                    >
                      <Icons.Star size={30} filled={st <= (hoverEstrelas || formAvaliacao.estrelas)} />
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Seu Nome *</label>
                <input
                  required
                  type="text"
                  value={formAvaliacao.nome}
                  onChange={e => setFormAvaliacao({ ...formAvaliacao, nome: e.target.value })}
                  placeholder="Ex.: Gabriel Lima"
                  className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400"
                />
              </div>

              <div>
                <label className="block text-xs font-black uppercase text-acai-subtext mb-1">O que você pediu?</label>
                <select
                  value={formAvaliacao.item}
                  onChange={e => setFormAvaliacao({ ...formAvaliacao, item: e.target.value })}
                  className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none font-bold"
                >
                  {MENU_STRICT.map(m => (
                    <option key={m.id} value={m.nome}>{m.nome}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-black uppercase text-acai-subtext mb-1">Seu Depoimento *</label>
                <textarea
                  required
                  rows="3"
                  value={formAvaliacao.comentario}
                  onChange={e => setFormAvaliacao({ ...formAvaliacao, comentario: e.target.value })}
                  placeholder="Conte o que achou da cremosidade do açaí e do atendimento..."
                  className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-400"
                ></textarea>
              </div>

              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => setModalAvaliacao(false)}
                  className="flex-1 py-2.5 rounded-full border border-acai-border font-bold text-xs"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2.5 rounded-full bg-amber-500 text-black font-black text-xs hover:bg-amber-400"
                >
                  Publicar Avaliação
                </button>
              </div>
            </form>
          </div>
        </div>
      )}


      {/* ================= MODAL: CONFIGURAÇÃO REST API ================= */}
      {showConfig && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-acai-card border border-acai-border rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl">
            <div className="flex justify-between items-center">
              <h3 className="font-black text-base text-white">Configurar Backend REST API</h3>
              <button onClick={() => setShowConfig(false)} className="text-acai-subtext hover:text-white">✕</button>
            </div>
            <p className="text-xs text-acai-subtext leading-relaxed">
              Informe a rota base da sua API de pedidos (ex: Spring Boot / Node / FastAPI).
            </p>
            <div>
              <label className="block text-[10px] font-black uppercase text-acai-subtext mb-1">URL Endpoint REST</label>
              <input
                type="text"
                value={urlEdit}
                onChange={e => setUrlEdit(e.target.value)}
                placeholder="http://localhost:8080/api/pedidos"
                className="w-full bg-acai-dark border border-acai-border rounded-xl p-3 text-xs text-white font-mono focus:outline-none focus:border-purple-400"
              />
            </div>
            <div className="flex gap-3">
              <button
                onClick={() => setShowConfig(false)}
                className="flex-1 py-2.5 rounded-full border border-acai-border text-xs font-bold"
              >
                Cancelar
              </button>
              <button
                onClick={() => {
                  if (urlEdit.trim()) {
                    setApiUrl(urlEdit.trim().replace(/\/$/, ''));
                    setShowConfig(false);
                    avisar('URL da API configurada com sucesso!');
                  }
                }}
                className="flex-1 py-2.5 rounded-full bg-purple-600 hover:bg-purple-500 text-white font-black text-xs"
              >
                Salvar & Conectar
              </button>
            </div>
          </div>
        </div>
      )}


      {/* ================= MODAL: EXCLUIR PEDIDO ================= */}
      {deletandoId !== null && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-acai-card border border-rose-900/50 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <div className="w-12 h-12 mx-auto rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center">
              <Icons.Trash size={24} />
            </div>
            <h3 className="font-black text-lg text-white">Remover esta comanda?</h3>
            <p className="text-xs text-acai-subtext">Esta operação enviará DELETE para seu backend e excluirá o registro.</p>
            <div className="flex gap-3">
              <button
                onClick={() => setDeletandoId(null)}
                className="flex-1 py-2.5 rounded-full bg-acai-dark border border-acai-border text-xs font-bold"
              >
                Cancelar
              </button>
              <button
                onClick={() => excluirPedido(deletandoId)}
                className="flex-1 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-black text-xs"
              >
                Remover
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
